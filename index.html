<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gann Screener</title>
<link rel="icon" id="fav" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" id="tc" content="#cfe8b0">
<script>try{var _t=localStorage.getItem("igs-theme");if(_t==="noir"||_t==="mono")document.getElementById("tc").setAttribute("content",_t==="noir"?"#000000":"#ffffff")}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gann">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="hdr row between">
    <div class="brand"><img id="brand-logo" src="logo.svg" alt=""><div><h1>Gann Screener</h1><div class="sub" id="hdr-sub"></div></div></div>
    <button class="icon-btn" id="quick-theme" aria-label="Theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
  </div>
  <a class="home-btn" href="india.html" style="color:var(--ink);text-decoration:none"><span class="ic">₹</span><span class="grow"><div class="t">Indian Market</div><div class="sub">Nifty, Sensex, 30 indices, 2,500+ NSE stocks</div><div class="q" id="q-in">&nbsp;</div></span><span class="go">→</span></a>
  <a class="home-btn" href="crypto.html" style="color:var(--ink);text-decoration:none"><span class="ic">₿</span><span class="grow"><div class="t">Crypto</div><div class="sub">Bitcoin · more coins coming</div><div class="q" id="q-cr">&nbsp;</div></span><span class="go">→</span></a>
  <div class="section"><h2>Theme</h2><div class="themes" id="themes"></div></div>
  <div class="foot">Gann cube levels, Square of 9 and 12, time cycles and astro history.<br>Not investment advice.</div>
</div>
<script>
const $=s=>document.querySelector(s);
const DATA="https://raw.githubusercontent.com/UnboxingBitcoin/indian-stocks/data/";
function chg(v){if(v==null)return"";const up=v>0;return`<span class="chg ${up?"up":v<0?"dn":""}">${up?"▲":v<0?"▼":"•"} ${(Math.abs(v)*100).toFixed(2)}%</span>`}
const THEMES=[["pista","Pista","#cfe8b0"],["butter","Butter","#ffe8a3"],["sky","Sky","#bfe3ff"],["bubblegum","Bubblegum","#ffc9e0"],["lilac","Lilac","#d9ccff"],["night","Night","#121a0f"],["mono","Mono","linear-gradient(135deg,#ffffff 50%,#000000 50%)"],["noir","Noir","#000000"]];
function applyTheme(t){
  t=THEMES.some(x=>x[0]===t)?t:"pista";
  if(t==="pista")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",t);
  try{localStorage.setItem("igs-theme",t)}catch(e){}
  const bw=t==="mono"||t==="noir",lg=bw?"logo-"+t+".svg":"logo.svg";
  $("#brand-logo").setAttribute("src",lg);$("#fav").setAttribute("href",bw?"logo-"+t+".png":"favicon.png");
  $("#tc").setAttribute("content",t==="noir"?"#000000":t==="mono"?"#ffffff":getComputedStyle(document.documentElement).getPropertyValue("--bg").trim());
  $("#themes").innerHTML=THEMES.map(([k,n,c])=>`<button class="theme-btn ${k===t?"on":""}" data-t="${k}"><i style="background:${c}"></i>${n}</button>`).join("");
  $("#themes").querySelectorAll(".theme-btn").forEach(b=>b.onclick=()=>applyTheme(b.dataset.t));
}
let cur;try{cur=localStorage.getItem("igs-theme")}catch(e){}
applyTheme(cur||"pista");
$("#quick-theme").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")||"pista";const i=THEMES.findIndex(x=>x[0]===t);applyTheme(THEMES[(i+1)%THEMES.length][0])};
$("#hdr-sub").textContent=new Date().toLocaleDateString("en-IN",{weekday:"short",month:"short",day:"numeric"});
(async()=>{try{const r=await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true");const j=await r.json();const b=j.bitcoin;
  $("#q-cr").innerHTML=`BTC $${b.usd.toLocaleString("en-US",{maximumFractionDigits:0})} ${chg(b.usd_24h_change/100)}`}catch(e){}})();
(async()=>{try{const m=await (await fetch(DATA+"meta.json?d="+new Date().toISOString().slice(0,10))).json();const n=(m.idx||[]).find(r=>r[1]==="N50");
  if(n)$("#q-in").innerHTML=`Nifty 50 ${n[2].toLocaleString("en-IN",{maximumFractionDigits:0})} ${chg(n[3])} <span class="sub">close</span>`}catch(e){}})();
</script>
</body>
</html>
